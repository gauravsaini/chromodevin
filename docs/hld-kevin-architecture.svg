<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hld-kevin-title hld-kevin-desc">
  <title id="hld-kevin-title">Kevin High-Level System Architecture</title>
  <desc id="hld-kevin-desc">High-level architecture showing Client Surfaces, Core Perception and WebGPU Decision Engine, and the Target Browser Execution Environment.</desc>

  <defs>
